<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GainLog">
<meta name="theme-color" content="#3E9BE0">
<title>GainLog</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------
   晴空投資帳本 — layout: card dashboard + bottom tab bar,
   content area swaps between home / stock-list / etf-list /
   market-value, with a sliding detail panel per symbol.
--------------------------------------------------------- */
:root{
  --bg-top:#DCEEFC; --bg-bottom:#FFFFFF;
  --surface:#FFFFFF; --surface-alt:#F3FAFE;
  --fg:#1C3040; --muted:#6B8AA3; --faint:#9FB9CC;
  --border:#DEECF7;
  --accent:#3E9BE0; --accent-strong:#1C7FC2; --accent-soft:#D9EEFC;
  --profit:#2E9E6E; --profit-soft:#DEF3EA;
  --loss:#E2574C; --loss-soft:#FCE4E2;
  /* TW convention: red = gain, green = decline */
  --gain:#E2574C; --gain-soft:#FCE4E2;
  --decline:#2E9E6E; --decline-soft:#DEF3EA;
  --gold:#D79A2C; --gold-soft:#FBF0DB;
  --shadow: 0 1px 2px rgba(28,64,96,.06), 0 6px 20px rgba(28,64,96,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#0D1B28; --bg-bottom:#0A141E;
    --surface:#142432; --surface-alt:#182B3B;
    --fg:#E7F2FA; --muted:#8CA9BF; --faint:#5A7488;
    --border:#223647;
    --accent:#5CB4F0; --accent-strong:#86CBFB; --accent-soft:#1E3A4D;
    --profit:#4FCB9A; --profit-soft:#163228;
    --loss:#F18A80; --loss-soft:#3A1E1D;
    --gain:#F18A80; --gain-soft:#3A1E1D;
    --decline:#4FCB9A; --decline-soft:#163228;
    --gold:#E8BB63; --gold-soft:#3A2E16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#0D1B28; --bg-bottom:#0A141E;
  --surface:#142432; --surface-alt:#182B3B;
  --fg:#E7F2FA; --muted:#8CA9BF; --faint:#5A7488;
  --border:#223647;
  --accent:#5CB4F0; --accent-strong:#86CBFB;
  --accent-soft:#1E3A4D;
  --profit:#4FCB9A; --profit-soft:#163228;
  --loss:#F18A80; --loss-soft:#3A1E1D;
  --gain:#F18A80; --gain-soft:#3A1E1D;
  --decline:#4FCB9A; --decline-soft:#163228;
  --gold:#E8BB63; --gold-soft:#3A2E16;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Noto Sans TC','Poppins',system-ui,sans-serif;
  color:var(--fg);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 320px);
  background-attachment: fixed;
  -webkit-font-smoothing:antialiased;
}
.num{ font-family:'Poppins','Noto Sans TC',sans-serif; font-variant-numeric:tabular-nums; }
h1,h2,h3{ font-family:'Poppins','Noto Sans TC',sans-serif; margin:0; text-wrap:balance; }
button{ font-family:inherit; }
::selection{ background:var(--accent-soft); }

/* ---------- app shell ---------- */
#app{ max-width:560px; margin:0 auto; min-height:100%; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); }

/* ---------- header ---------- */
header.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  padding:14px 18px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  backdrop-filter:saturate(160%) blur(10px);
  background:linear-gradient(180deg, color-mix(in srgb, var(--bg-top) 88%, transparent) 70%, transparent);
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand svg{ width:30px; height:30px; flex:none; }
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-text b{ font-size:16.5px; font-weight:700; letter-spacing:.2px; }
.brand-text span{ font-size:11px; color:var(--muted); letter-spacing:.3px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  color:var(--fg); cursor:pointer; box-shadow:var(--shadow); flex:none;
}
.icon-btn svg{ width:18px; height:18px; }
.icon-btn:active{ transform:scale(.94); }
.header-actions{ display:flex; gap:8px; }

/* ---------- main / sections ---------- */
main{ padding:4px 18px 10px; }
.section-title{ font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.4px; margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between; }
.section-title .tag{ font-weight:500; color:var(--faint); }

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); padding:16px;
}
.hero-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }

.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:15px;
  box-shadow:var(--shadow); padding:11px 8px; cursor:pointer; min-width:0;
  display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden;
  transition:transform .15s ease;
}
.stat-card:active{ transform:scale(.98); }
.stat-card .label{ font-size:10.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:4px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-card .label svg{ width:12px; height:12px; flex:none; }
.stat-card .value{ font-size:16.5px; font-weight:700; letter-spacing:0; line-height:1.2; }
.stat-card .sub{ font-size:10px; color:var(--faint); font-weight:600; }
.stat-card .corner{ position:absolute; right:-16px; top:-16px; width:56px; height:56px; border-radius:50%; opacity:.4; }
.stat-stock .corner{ background:var(--accent-soft); }
.stat-etf .corner{ background:var(--profit-soft); }
.stat-div .corner{ background:var(--gold-soft); }
.up{ color:var(--gain); } .down{ color:var(--decline); }

/* ---------- lists ---------- */
.sym-list{ display:flex; flex-direction:column; gap:10px; }
.sym-item{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:13px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:var(--shadow);
}
.sym-item:active{ transform:scale(.99); }
.sym-avatar{
  width:42px; height:42px; border-radius:12px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; font-family:'Poppins',sans-serif;
  background:var(--accent-soft); color:var(--accent-strong);
}
.sym-item.type-etf .sym-avatar{ background:var(--profit-soft); color:var(--profit); }
.sym-main{ flex:1; min-width:0; }
.sym-main .name{ font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:6px; }
.sym-main .code{ font-size:12px; color:var(--muted); font-family:'Poppins',sans-serif; }
.sym-right{ text-align:right; flex:none; }
.sym-right .v{ font-weight:700; font-size:14.5px; }
.sym-right .l{ font-size:11px; color:var(--faint); }
.chev{ color:var(--faint); flex:none; }
.chev svg{ width:16px; height:16px; }

.empty{
  text-align:center; padding:40px 18px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.empty svg{ width:52px; height:52px; color:var(--faint); }
.empty b{ color:var(--fg); font-size:14.5px; }
.empty p{ margin:0; font-size:13px; line-height:1.6; max-width:280px; }

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--fg);
  border-radius:12px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn svg{ width:15px; height:15px; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--accent-strong); }
.btn-danger{ background:var(--loss-soft); border-color:var(--loss-soft); color:var(--loss); }
.btn-block{ width:100%; }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:10px; }
.fab{
  position:fixed; right:calc(18px + (100% - 560px) / 2); bottom:calc(92px + env(safe-area-inset-bottom,0px));
  width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
  background:var(--accent); color:#fff; box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 50%, transparent);
  display:flex; align-items:center; justify-content:center; z-index:35;
}
@media (max-width:596px){ .fab{ right:18px; } }
.fab svg{ width:22px; height:22px; }

/* ---------- bottom nav ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:center;
}
.tabbar-inner{
  width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; box-shadow:var(--shadow); display:flex; padding:6px;
}
.tab-btn{
  flex:1; border:none; background:transparent; color:var(--muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:14px;
  font-size:10.5px; font-weight:600;
}
.tab-btn svg{ width:20px; height:20px; }
.tab-btn.active{ color:var(--accent-strong); background:var(--accent-soft); }

/* ---------- detail panel ---------- */
.detail-head{ display:flex; align-items:center; gap:10px; margin:4px 0 16px; }
.detail-head .sym-avatar{ width:46px; height:46px; }
.detail-title{ flex:1; min-width:0; }
.detail-title h2{ font-size:18px; font-weight:700; display:flex; align-items:center; gap:7px; }
.detail-title .code{ font-size:12.5px; color:var(--muted); font-family:'Poppins',sans-serif; }
.badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.3px; }
.badge-stock{ background:var(--accent-soft); color:var(--accent-strong); }
.badge-etf{ background:var(--profit-soft); color:var(--profit); }

.metric-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.metric{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 10px; text-align:center; box-shadow:var(--shadow); }
.metric .mv{ font-size:16px; font-weight:700; }
.metric .ml{ font-size:10.5px; color:var(--muted); margin-top:3px; }

.subtabs{ display:flex; gap:4px; margin-bottom:14px; background:var(--surface-alt); padding:4px; border-radius:12px; }
.subtab{ flex:1; min-width:0; border:none; background:transparent; padding:8px 2px; border-radius:9px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subtab.active{ background:var(--surface); color:var(--fg); box-shadow:var(--shadow); }

.filter-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
.seg{ display:flex; background:var(--surface-alt); border-radius:10px; padding:3px; }
.seg button{ border:none; background:transparent; padding:6px 11px; font-size:12px; font-weight:600; color:var(--muted); border-radius:8px; cursor:pointer; }
.seg button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }

.period-bar{ display:flex; align-items:center; gap:8px; margin:6px 0 16px; flex-wrap:wrap; }
.period-bar .seg{ flex:none; }
.period-bar select, .period-bar input[type="month"]{
  border:1px solid var(--border); background:var(--surface); color:var(--fg);
  border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:600; font-family:inherit;
}
.period-note{ font-size:11px; color:var(--faint); margin:-10px 0 14px; line-height:1.5; }

.row-list{ display:flex; flex-direction:column; gap:8px; }
.row-item{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:11px 13px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
}
.row-item .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.dot-buy{ background:var(--loss); } .dot-sell{ background:var(--profit); } .dot-div{ background:var(--gold); } .dot-split{ background:var(--accent); }
.row-mid{ flex:1; min-width:0; }
.row-mid .t1{ font-size:13.5px; font-weight:600; }
.row-mid .t2{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.row-amt{ text-align:right; font-weight:700; font-size:13.5px; flex:none; }
.row-del{ flex:none; width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--faint); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.row-del svg{ width:14px; height:14px; }

table.pl-table{ width:100%; border-collapse:collapse; font-size:13px; }
table.pl-table th{ text-align:left; font-size:11px; color:var(--muted); font-weight:600; padding:0 8px 8px; border-bottom:1px solid var(--border); }
table.pl-table td{ padding:9px 8px; border-bottom:1px solid var(--border); }
table.pl-table tr:last-child td{ border-bottom:none; }
.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:4px 8px; }

.total-strip{ display:flex; justify-content:space-between; align-items:center; background:var(--surface-alt); border-radius:12px; padding:11px 14px; margin-bottom:12px; }
.total-strip .l{ font-size:12.5px; color:var(--muted); font-weight:600; }
.total-strip .v{ font-size:17px; font-weight:700; }

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,20,30,.42); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center; z-index:60; opacity:0; pointer-events:none;
  transition:opacity .18s ease;
}
.overlay.show{ opacity:1; pointer-events:auto; }
@media (min-width:600px){ .overlay{ align-items:center; } }
.sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:22px 22px 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
  transform:translateY(16px); transition:transform .18s ease; box-shadow:0 -10px 40px rgba(10,30,50,.25);
}
@media (min-width:600px){ .sheet{ border-radius:22px; max-height:80vh; } }
.overlay.show .sheet{ transform:translateY(0); }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head h3{ font-size:16px; font-weight:700; }
.field{ margin-bottom:13px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--border); background:var(--surface-alt); color:var(--fg);
  border-radius:11px; padding:11px 12px; font-size:14.5px; font-family:inherit;
}
.field textarea{ resize:vertical; min-height:90px; font-family:'Poppins',monospace; font-size:12px; line-height:1.5; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.toggle-row{ display:flex; gap:8px; }
.toggle-row .opt{
  flex:1; text-align:center; padding:10px; border-radius:11px; border:1px solid var(--border);
  background:var(--surface-alt); font-weight:600; font-size:13.5px; cursor:pointer; color:var(--muted);
}
.toggle-row .opt.active.buy{ background:var(--loss-soft); color:var(--loss); border-color:var(--loss-soft); }
.toggle-row .opt.active.sell{ background:var(--profit-soft); color:var(--profit); border-color:var(--profit-soft); }
.toggle-row .opt.active.stock{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-soft); }
.toggle-row .opt.active.etf{ background:var(--profit-soft); color:var(--profit); border-color:var(--profit-soft); }
.sheet-actions{ display:flex; gap:10px; margin-top:6px; }
.sheet-actions .btn{ flex:1; }
.hint{ font-size:11.5px; color:var(--faint); margin-top:-6px; margin-bottom:13px; line-height:1.5; }
.switch-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 2px; }
.switch-row .t{ font-size:13.5px; font-weight:600; }
.switch-row .d{ font-size:11.5px; color:var(--muted); margin-top:2px; }
.switch{ position:relative; width:44px; height:26px; flex:none; }
.switch input{ opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--border); border-radius:999px; transition:.15s; }
.switch .thumb{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.15s; }
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked ~ .thumb{ transform:translateX(18px); }

.toast{
  position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
  background:var(--fg); color:var(--bg-bottom); padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600;
  z-index:80; opacity:0; pointer-events:none; transition:.2s ease; box-shadow:var(--shadow);
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

.demo-banner{
  display:flex; align-items:center; gap:10px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  border-radius:14px; padding:11px 13px; margin:10px 0 4px; font-size:12px; color:var(--fg);
}
.demo-banner b{ color:var(--gold); }
.demo-banner button{ flex:none; }

.market-empty-art{ width:120px; height:120px; margin:0 auto 6px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>

"use strict";

const I = {

/* ===================== CALC ===================== */
function txForCode(code){ return DB.transactions.filter(t=>t.code===code); }
function splitsForCode(code){ return DB.splits.filter(s=>s.code===code); }
function divForCode(code){ return DB.dividends.filter(d=>d.code===code); }
function exdivForCode(code){ return DB.exdiv.filter(d=>d.code===code); }

function computeTimeline(code){
  const events = [];
  txForCode(code).forEach(t=>events.push(Object.assign({kind:'tx'}, t)));
  splitsForCode(code).forEach(s=>events.push(Object.assign({kind:'split'}, s)));
  events.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    if(a.kind!==b.kind) return a.kind==='split'?-1:1;
    return 0;
  });
  let qty=0, avgCost=0;
  const realized = [];
  events.forEach(e=>{
    if(e.kind==='split'){
      const m = Number(e.multiplier)||1;
      qty = qty*m;
      avgCost = m!==0 ? avgCost/m : avgCost;
    } else if(e.type==='buy'){
      const totalCost = qty*avgCost + e.qty*e.price;
      qty += e.qty;
      avgCost = qty>0 ? totalCost/qty : 0;
    } else if(e.type==='sell'){
      const sellQty = e.qty;
      const pl = (e.price - avgCost) * sellQty;
      qty -= sellQty;
      realized.push({id:e.id, date:e.date, amount:pl, qty:sellQty, price:e.price});
    }
  });
  return { qty, avgCost, realized };
}
function holdingCost(code){ const t = computeTimeline(code); return t.qty*t.avgCost; }
function dividendTotal(code){ return divForCode(code).reduce((s,d)=>s+Number(d.amount||0),0); }

function symbolRealizedTotal(code){ return computeTimeline(code).realized.reduce((a,r)=>a+r.amount,0); }

/* ---- global 年/月/全部 period filter, used by home / list / market pages ---- */
function matchesPeriod(dateStr, pf){
  pf = pf || state.pf;
  if(!pf || pf.mode==='all') return true;
  if(pf.mode==='year') return dateStr.slice(0,4)===pf.year;
  if(pf.mode==='month') return dateStr.slice(0,7)===pf.month;
  return true;
}
function realizedInPeriod(code){ return computeTimeline(code).realized.filter(r=>matchesPeriod(r.date)).reduce((s,r)=>s+r.amount,0); }
function buyCostInPeriod(code){ return txForCode(code).filter(t=>t.type==='buy' && matchesPeriod(t.date)).reduce((s,t)=>s+t.price*t.qty,0); }
function dividendInPeriod(code){ return divForCode(code).filter(d=>matchesPeriod(d.date)).reduce((s,d)=>s+Number(d.amount||0),0); }
function allStockRealizedInPeriod(){
  let sum=0; DB.symbols.filter(s=>s.type==='stock').forEach(s=>{ sum += realizedInPeriod(s.code); }); return sum;
}
function allEtfInvestedInPeriod(){
  let sum=0; DB.symbols.filter(s=>s.type==='etf').forEach(s=>{ sum += buyCostInPeriod(s.code); }); return sum;
}
function allEtfDividendInPeriod(){
  let sum=0; DB.symbols.filter(s=>s.type==='etf').forEach(s=>{ sum += dividendInPeriod(s.code); }); return sum;
}
function availableYears(){
  const ys = new Set([String(new Date().getFullYear())]);
  DB.transactions.forEach(t=>ys.add(t.date.slice(0,4)));
  DB.dividends.forEach(d=>ys.add(d.date.slice(0,4)));
  DB.splits.forEach(s=>ys.add(s.date.slice(0,4)));
  return Array.from(ys).sort().reverse();
}
function periodLabelShort(pf){
  pf = pf || state.pf;
  if(pf.mode==='year') return pf.year+'年';
  if(pf.mode==='month'){ const [y,m]=pf.month.split('-'); return y+'/'+m; }
  return '全部';
}

function periodKey(date, gran){
  if(gran==='year') return date.slice(0,4);
  if(gran==='month') return date.slice(0,7);
  return date;
}
function groupPL(realized, gran){
  const map = {};
  realized.forEach(r=>{ const k = periodKey(r.date, gran); map[k] = (map[k]||0) + r.amount; });
  return Object.keys(map).sort().reverse().map(k=>({ period:k, amount:map[k] }));
}

/* ===================== FORMAT ===================== */
function fmt(n){
  n = Math.round(Number(n)||0);
  const neg = n<0; n=Math.abs(n);
  const s = n.toLocaleString('en-US');
  return (neg?'-':'') + 'NT$' + s;
}
function fmtNum(n, d){
  d = d||0;
  return Number(n||0).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtCompact(n){
  n = Number(n)||0;
  const neg = n<0; const abs = Math.abs(n);
  let s;
  if(abs >= 100000000) s = (abs/100000000).toFixed(2)+'億';
  else if(abs >= 10000) s = (abs/10000).toFixed(1)+'萬';
  else s = Math.round(abs).toLocaleString('en-US');
  return (neg?'-':'') + s;
}
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-');
  return y+'/'+m+'/'+d;
}
function todayStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const names = etfSymbols.filter(s=>DB.dividends.some(d=>d.code===s.code));

  html += '<div class="table-wrap"><table class="pl-table"><thead><tr><th>年度</th>'+
    names.map(n=>'<th style="text-align:right;">'+esc(n.name)+'</th>').join('')+
    '<th style="text-align:right;">小計</th></tr></thead><tbody>';
  years.forEach(y=>{
    let rowTotal=0;
    html += '<tr><td class="num">'+y+'</td>';
    names.forEach(n=>{
      const sum = allDiv.filter(d=>d.code===n.code && d.date.slice(0,4)===y).reduce((s,d)=>s+Number(d.amount),0);
      rowTotal += sum;
      html += '<td class="num" style="text-align:right;">'+(sum? fmtNum(sum): '—')+'</td>';
    });
    html += '<td class="num" style="text-align:right;font-weight:700;">'+fmtNum(rowTotal)+'</td></tr>';
  });
  html += '</tbody></table></div>';

  html += '<div class="section-title">各標的累計股息<span class="tag">'+periodLabelShort()+'</span></div><div class="row-list">';
  names.forEach(n=>{
    const sum = dividendInPeriod(n.code);
    html += '<div class="row-item"><div class="dot dot-div"></div><div class="row-mid"><div class="t1">'+esc(n.name)+'</div><div class="t2">'+esc(n.code)+'</div></div><div class="row-amt num" style="color:var(--gold);">'+fmt(sum)+'</div></div>';
  });
  html += '</div>';
  return html;
}

function renderMarket(){
  const enabled = DB.symbols.filter(s=> DB.market[s.code] && DB.market[s.code].enabled);
  let html = '<div class="section-title">市值總覽<span class="tag">需手動設定</span></div>';

  if(enabled.length===0){
    html += '<div class="empty">'+I.market+
      '<b>尚未設定任何市值</b>'+
      '<p>市值資料不會自動抓取，也不會混進你平常看的投入/股息紀錄裡。想追蹤報酬率的話，先選擇要納入計算的標的並輸入目前股價。</p>'+
      '<button class="btn btn-primary" onclick="UI.openMarketManageSheet()">'+I.plus+' 設定市值標的</button>'+
      '</div>';
    return html;
  }

  html += periodFilterBar();
  html += '<div class="period-note">成本與市值是目前持股的即時狀態，只有股息會依上方期間篩選。</div>';

  let totalCost=0, totalValue=0, totalDiv=0;
  const rows = enabled.map(s=>{
    const tl = computeTimeline(s.code);
    const m = DB.market[s.code];
    const cost = tl.qty*tl.avgCost;
    const value = tl.qty*(Number(m.price)||0);
    const div = s.type==='etf' ? dividendInPeriod(s.code) : 0;
    totalCost+=cost; totalValue+=value; totalDiv+=div;
    return {sym:s, cost, value, div, updatedAt:m.updatedAt};
  });
  const totalReturn = totalValue + totalDiv - totalCost;
  const totalPct = totalCost>0 ? (totalReturn/totalCost*100) : 0;

  html += '<div class="card" style="margin-bottom:16px;">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:12px;color:var(--muted);font-weight:600;">成本</span><span class="num" style="font-weight:700;">'+fmt(totalCost)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:12px;color:var(--muted);font-weight:600;">市值</span><span class="num" style="font-weight:700;">'+fmt(totalValue)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:12px;color:var(--muted);font-weight:600;">累計股息 · '+periodLabelShort()+'</span><span class="num" style="font-weight:700;color:var(--gold);">'+fmt(totalDiv)+'</span></div>'+
    '<div style="height:1px;background:var(--border);margin:10px 0;"></div>'+
    '<div style="display:flex;justify-content:space-between;"><span style="font-size:13px;font-weight:700;">含息報酬</span><span class="num '+(totalReturn>=0?'up':'down')+'" style="font-weight:700;font-size:17px;">'+fmt(totalReturn)+' ('+(totalPct>=0?'+':'')+fmtNum(totalPct,2)+'%)</span></div>'+
    '</div>';

  html += '<div class="section-title">持股明細<button class="btn btn-ghost btn-sm" onclick="UI.openMarketManageSheet()">管理標的</button></div>';
  html += '<div class="sym-list">';
  rows.forEach(r=>{
    const ret = r.value + r.div - r.cost;
    const pct = r.cost>0 ? ret/r.cost*100 : 0;
    html += '<div class="sym-item type-'+r.sym.type+'" onclick="UI.openDetail(\''+r.sym.code+'\')">'+
      '<div class="sym-avatar">'+esc(r.sym.code.slice(0,4))+'</div>'+
      '<div class="sym-main"><div class="name">'+esc(r.sym.name)+'</div><div class="code">成本 '+fmtNum(r.cost)+' · 市值 '+fmtNum(r.value)+'</div></div>'+
      '<div class="sym-right"><div class="v num '+(ret>=0?'up':'down')+'">'+(pct>=0?'+':'')+fmtNum(pct,1)+'%</div><div class="l">'+fmtDate(r.updatedAt||'')+' 更新</div></div>'+
      '<div class="chev">'+I.chev+'</div></div>';
  });
  html += '</div>';
  return html;
}

/* ===================== RENDER: DETAIL ===================== */
function renderDetail(code){
  const sym = DB.symbols.find(s=>s.code===code);
  if(!sym) return emptyState('找不到這筆標的','可能已被刪除。', I.inbox);
  const tl = computeTimeline(code);
  const isEtf = sym.type==='etf';
  const realizedTotal = tl.realized.reduce((s,r)=>s+r.amount,0);

  let html = '<div class="detail-head"><div class="sym-avatar">'+esc(code.slice(0,4))+'</div>'+
    '<div class="detail-title"><h2>'+esc(sym.name)+' <span class="badge badge-'+sym.type+'">'+(isEtf?'ETF':'個股')+'</span></h2>'+
    '<div class="code">'+esc(code)+'</div></div>'+
    '<button class="icon-btn" onclick="UI.confirmDeleteSymbol(\''+code+'\')">'+I.trash+'</button>'+
    '</div>';

  html += '<div class="metric-row">'+
    '<div class="metric"><div class="mv num">'+fmtNum(tl.qty)+'</div><div class="ml">持有股數</div></div>'+
    '<div class="metric"><div class="mv num">'+fmtNum(tl.avgCost,2)+'</div><div class="ml">加權均價</div></div>'+
    '<div class="metric"><div class="mv num '+(isEtf?'':(realizedTotal>=0?'up':'down'))+'">'+(isEtf?fmtNum(tl.qty*tl.avgCost):fmt(realizedTotal))+'</div><div class="ml">'+(isEtf?'投入成本':'已實現損益')+'</div></div>'+
    '</div>';

  const subtabs = [{k:'tx',label:'交易紀錄'}];
  if(isEtf){ subtabs.push({k:'div',label:'股利紀錄'}); subtabs.push({k:'exdiv',label:'除息日'}); }
  else { subtabs.push({k:'pl',label:'損益統計'}); }
  subtabs.push({k:'split',label:'股票分割'});
  html += '<div class="subtabs">' + subtabs.map(t=>
    '<button class="subtab'+(state.detailSub===t.k?' active':'')+'" onclick="UI.setDetailSub(\''+t.k+'\')">'+t.label+'</button>'
  ).join('') + '</div>';

  if(state.detailSub==='tx') html += renderTxSection(sym);
  else if(state.detailSub==='div') html += renderDivSection(sym);
  else if(state.detailSub==='exdiv') html += renderExdivSection(sym);
  else if(state.detailSub==='pl') html += renderPlSection(sym, isEtf);
  else if(state.detailSub==='split') html += renderSplitSection(sym);

  return html;
}

function renderPlSection(sym, isEtf){
  const tl = computeTimeline(sym.code);
  let html = '<div class="filter-row"><div style="font-size:12.5px;color:var(--muted);font-weight:600;">已實現損益</div>'+
    '<div class="seg">'+
      ['day','月','year'].map(()=>'').join('') +
      '<button class="'+(state.plGran==='day'?'active':'')+'" onclick="UI.setPlGran(\'day\')">日</button>'+
      '<button class="'+(state.plGran==='month'?'active':'')+'" onclick="UI.setPlGran(\'month\')">月</button>'+
      '<button class="'+(state.plGran==='year'?'active':'')+'" onclick="UI.setPlGran(\'year\')">年</button>'+
    '</div></div>';
  const grouped = groupPL(tl.realized, state.plGran);
  const total = tl.realized.reduce((s,r)=>s+r.amount,0);
  html += '<div class="total-strip"><div class="l">累計已實現損益</div><div class="v num '+(total>=0?'up':'down')+'">'+fmt(total)+'</div></div>';
  if(grouped.length===0){
    html += emptyState('還沒有已實現損益', '賣出後系統會自動依加權平均成本計算損益，並依你選的日/月/年彙整在這裡。', I.market);
    return html;
  }
  html += '<div class="table-wrap"><table class="pl-table"><thead><tr><th>期間</th><th style="text-align:right;">損益</th></tr></thead><tbody>'+
    grouped.map(g=> '<tr><td class="num">'+periodLabel(g.period, state.plGran)+'</td><td class="num '+(g.amount>=0?'up':'down')+'" style="text-align:right;font-weight:700;">'+fmt(g.amount)+'</td></tr>').join('')+
    '</tbody></table></div>';
  return html;
}
function periodLabel(p, gran){
  if(gran==='year') return p+' 年';
  if(gran==='month'){ const [y,m]=p.split('-'); return y+'/'+m; }
  return fmtDate(p);
}

  if(!date || !(multiplier>0)){ toast('請填寫日期與倍數'); return; }
  DB.splits.push({id:nextId(), code, date, multiplier});
  save(); closeSheet(); toast('已新增分割紀錄'); render();
}

function openMarketManageSheet(){
  const items = DB.symbols.map(s=>{
    const m = DB.market[s.code] || {enabled:false, price:'', updatedAt:''};
    return '<div class="card" style="margin-bottom:10px;">'+
      '<div class="switch-row" style="padding:0 0 10px;">'+
        '<div><div class="t">'+esc(s.name)+'</div><div class="d">'+esc(s.code)+'</div></div>'+
        '<label class="switch"><input type="checkbox" '+(m.enabled?'checked':'')+' onchange="UI.toggleMarketEnabled(\''+s.code+'\', this.checked)"><div class="track"></div><div class="thumb"></div></label>'+
      '</div>'+
      '<div class="field" style="margin-bottom:0;"><label>目前股價</label><input type="number" step="0.01" value="'+(m.price||'')+'" placeholder="0.00" onchange="UI.setMarketPrice(\''+s.code+'\', this.value)"></div>'+
      '</div>';
  }).join('');
  openSheet(
    '<div class="sheet-head"><h3>管理市值標的</h3><button class="icon-btn" onclick="UI.closeSheet()">'+I.close+'</button></div>'+
    '<div class="hint" style="margin-top:0;">開啟開關並輸入目前股價，才會被計入市值總覽；股價需要自己定期更新。</div>'+
    (items || emptyState('還沒有任何標的','先到個股或存股新增標的。', I.inbox)) +
    '<div class="sheet-actions" style="margin-top:4px;"><button class="btn btn-primary btn-block" onclick="UI.closeSheet();UI.render()">完成</button></div>'
  );
}
function toggleMarketEnabled(code, checked){
  if(!DB.market[code]) DB.market[code] = {enabled:false, price:0, updatedAt:''};
  DB.market[code].enabled = checked;
  save();
}
function setMarketPrice(code, val){
  const price = parseFloat(val);
  if(!DB.market[code]) DB.market[code] = {enabled:true, price:0, updatedAt:''};
  DB.market[code].price = isNaN(price) ? 0 : price;
  DB.market[code].updatedAt = todayStr();
  save();
}

/* ---------- settings / backup ---------- */
function openSettingsSheet(){
  openSheet(
    '<div class="sheet-head"><h3>設定與備份</h3><button class="icon-btn" onclick="UI.closeSheet()">'+I.close+'</button></div>'+
    '<div class="hint" style="margin-top:0;">資料只存在這支手機、這個瀏覽器裡。清除瀏覽器資料前，記得先匯出備份。</div>'+
    '<div class="sheet-actions" style="flex-direction:column;gap:10px;">'+
      '<button class="btn btn-primary btn-block" onclick="UI.openExportSheet()">匯出備份</button>'+
      '<button class="btn btn-block" onclick="UI.openImportSheet()">從備份匯入</button>'+
      (DB.demo ? '<button class="btn btn-block" onclick="UI.clearDemo()">清除範例資料</button>' : '<button class="btn btn-danger btn-block" onclick="UI.confirmResetAll()">清除全部資料</button>')+
    '</div>'
  );
}
function openExportSheet(){
  const json = JSON.stringify(DB, null, 2);
  openSheet(
    '<div class="sheet-head"><h3>匯出備份</h3><button class="icon-btn" onclick="UI.closeSheet()">'+I.close+'</button></div>'+
    '<div class="hint" style="margin-top:0;">這個網頁版沒辦法直接存檔案，請複製下方內容，貼到備忘錄、雲端筆記或傳給自己，之後就能用「從備份匯入」還原。</div>'+
    '<div class="field"><textarea id="exportText" readonly rows="8">'+esc(json)+'</textarea></div>'+
    '<div class="sheet-actions"><button class="btn btn-primary btn-block" id="copyBtn">'+I.copy+' 複製全部內容</button></div>'
  );
  document.getElementById('copyBtn').onclick = function(){
    const ta = document.getElementById('exportText');
    ta.select(); ta.setSelectionRange(0, 999999);
    const done = ()=> toast('已複製，貼到你想保存的地方吧');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(done).catch(()=>{ try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請手動選取文字複製'); } });
    } else {
      try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請手動選取文字複製'); }
    }
  };
}
function openImportSheet(){
  openSheet(
    '<div class="sheet-head"><h3>從備份匯入</h3><button class="icon-btn" onclick="UI.closeSheet()">'+I.close+'</button></div>'+
    '<div class="hint" style="margin-top:0;">貼上之前匯出的備份內容。匯入後會覆蓋目前手機上的所有資料，請先確認。</div>'+
    '<div class="field"><textarea id="importText" rows="8" placeholder="貼上備份的 JSON 內容..."></textarea></div>'+
    '<div class="sheet-actions"><button class="btn" onclick="UI.closeSheet()">取消</button><button class="btn btn-primary" onclick="UI.submitImport()">匯入並覆蓋</button></div>'
  );
}
function submitImport(){
  const raw = document.getElementById('importText').value.trim();
  if(!raw){ toast('請先貼上備份內容'); return; }
  try{
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.symbols)) throw new Error('format');
    data.demo = false;
    if(!data.seq) data.seq = 1;
    if(!data.market) data.market = {};
    if(!data.exdiv) data.exdiv = [];
    if(!data.dividends) data.dividends = [];
    if(!data.splits) data.splits = [];
    DB = data; save(); closeSheet(); toast('匯入成功'); go('home');
  }catch(e){ toast('格式錯誤，請確認貼上的是完整備份內容'); }
}
function confirmResetAll(){
  confirmSheet('將清除這支手機上所有的投資紀錄，且無法復原。建議先匯出備份。', function(){
    DB = freshDB(); save(); toast('已清除全部資料'); go('home');
  });
}
function clearDemo(){
  DB = freshDB(); save(); toast('已清除範例資料，開始記錄你自己的投資吧'); render();
}

/* ---------- deletions ---------- */
function confirmDeleteSymbol(code){
  const sym = DB.symbols.find(s=>s.code===code);
  confirmSheet('將刪除「'+(sym?sym.name:code)+'」及其所有交易、股息、分割紀錄，且無法復原。', function(){
    DB.symbols = DB.symbols.filter(s=>s.code!==code);
    DB.transactions = DB.transactions.filter(t=>t.code!==code);
    DB.dividends = DB.dividends.filter(d=>d.code!==code);
    DB.exdiv = DB.exdiv.filter(d=>d.code!==code);
    DB.splits = DB.splits.filter(s=>s.code!==code);
    delete DB.market[code];
    save(); closeDetail(); toast('已刪除');
  });
}
function confirmDeleteTx(id){
  confirmSheet('確定要刪除這筆交易紀錄嗎？', function(){
    DB.transactions = DB.transactions.filter(t=>t.id!==id);
    save(); toast('已刪除交易紀錄'); render();
  });
}
function confirmDeleteDiv(id){
  confirmSheet('確定要刪除這筆股息紀錄嗎？', function(){
    DB.dividends = DB.dividends.filter(d=>d.id!==id);
    save(); toast('已刪除股息紀錄'); render();
  });
}
function confirmDeleteExdiv(id){
  confirmSheet('確定要刪除這筆除息日紀錄嗎？', function(){
    DB.exdiv = DB.exdiv.filter(d=>d.id!==id);
    save(); toast('已刪除除息日紀錄'); render();
  });
}
function confirmDeleteSplit(id){
  confirmSheet('確定要刪除這筆分割紀錄嗎？', function(){
    DB.splits = DB.splits.filter(s=>s.id!==id);
    save(); toast('已刪除分割紀錄'); render();
  });
}

/* ===================== small setters ===================== */
function setEtfSub(v){ state.etfSub=v; render(); }
function setDetailSub(v){ state.detailSub=v; render(); }
function setPlGran(v){ state.plGran=v; render(); }

/* ===================== PUBLIC API ===================== */
window.UI = {
  go, openDetail, closeDetail, setEtfSub, setDetailSub, setPlGran,
  setPfMode, setPfYear, setPfMonth,
  openAddSymbolSheet, pickSymType, submitAddSymbol,
  openTxSheet, pickTxType, submitTx,
  openDivSheet, submitDiv,
  openExdivSheet, submitExdiv,
  openSplitSheet, submitSplit,
  openMarketManageSheet, toggleMarketEnabled, setMarketPrice,
  openSettingsSheet, openExportSheet, openImportSheet, submitImport,
  confirmResetAll, clearDemo,
  confirmDeleteSymbol, confirmDeleteTx, confirmDeleteDiv, confirmDeleteExdiv, confirmDeleteSplit,
  closeSheet, render,
};

/* ===================== BOOT ===================== */
function start(){
  load();
  render();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(start) : start();
} else {
  start();
}
})();
</script>
</body>
